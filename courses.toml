# The course catalogue.
#
# The catalogue section of the site is generated from this file, so adding a
# course or opening one means editing here and rebuilding — not touching HTML.
#
# status:
#   open    the course exists and can be taken today. Drawn in orange, with a
#           real channel off the lap in its lane.
#   closed  anything else. Drawn grey, with a flat NO SIGNAL lane.
#
#   There are deliberately only two. The words in status_label carry the
#   difference between "in development" and "planned"; the colours do not try
#   to, because teal against grey measures dE 13.0 to normal vision, which is
#   below the legibility floor.
#
# channel: a channel name present in public/lap.json, drawn in the lane.
#          Only used when status = "open".
#
# slug:    gives the course its own page at /courses/<slug>/. Omit it and the
#          course appears in the catalogue but gets no page of its own, which
#          is what you want for one that does not exist yet.
# time:    shown on the course page. Omit it unless it has been measured.
# description: the meta description and the JSON-LD description for that page.

[[courses]]
id           = "course-01"
number       = "Course 01"
name         = "Introduction to Open Streaming Foundations"
status       = "open"
status_label = "Open now"
summary      = "The pipeline, and the four ideas a bare Kafka topic has no concept of."
meta         = "4 modules · free · no licence"
channel      = "Speed"
slug         = "introduction-to-open-streaming-foundations"
description  = "A free, four-module course in real-time telemetry. Run a broker, a streaming API and a synthetic race car, write code against them, and have a bot grade your work. No licence, nothing to install."

  [[courses.modules]]
  label   = "Module 01"
  title   = "Make it yours"
