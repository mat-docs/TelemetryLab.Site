  graded  = "graded — the session carries your handle, and the data reaches Kafka"

  [[courses.modules]]
  label   = "Module 02"
  title   = "Add a channel"
  summary = "Declare a parameter and emit it. A consumer you did not touch picks up its units."
  graded  = "graded — a channel the lab does not ship appears, with units"

  [[courses.modules]]
  label   = "Module 03"
  title   = "Fix the broken producer"
  summary = "A variant produces jumpy traces. Nothing errors. Every value is correct. Find out why."
  graded  = "graded — zero discontinuities across the session"

  [[courses.modules]]
  label   = "Module 04"
  title   = "Write your first consumer"
  summary = "Decode the stream yourself, in any language. The validator invents a new channel each run, so you cannot hardcode your way through."
